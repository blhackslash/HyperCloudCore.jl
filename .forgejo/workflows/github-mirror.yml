# .forgejo/workflows/github-mirror.yml
#
# Mirrors `main` and every `claude/*` branch from Forgejo to GitHub,
# including deletions: a `claude/*` branch that no longer exists on Forgejo
# is deleted on GitHub. This is not a full --mirror: branches outside these
# patterns (gh-pages from Documenter, anything created on GitHub) are never
# touched, and tags are only created/updated (TagBot's tags stay).
#
# Setup (per repo, or once at user/org level):
#   Secret   GH_MIRROR_TOKEN  - GitHub fine-grained PAT with
#                               "Contents: Read and write" and
#                               "Workflows: Read and write" on the target repo(s)
#   Variable FORGE_URL        - base URL of your Forgejo instance,
#                               e.g. https://git.example.com
#   Variable GH_MIRROR_OWNER  - (optional) GitHub user/org, if it differs
#                               from your Forgejo owner name

name: Push to GitHub

on:
  workflow_dispatch:

concurrency:
  group: github-mirror
  cancel-in-progress: false

jobs:
  push:
    runs-on: docker   # adjust to a label your Forgejo runner provides
    steps:
      - name: Push branches and tags to GitHub
        env:
          SRC_TOKEN: ${{ github.token }}
          SRC_SERVER: ${{ vars.FORGE_URL }}   # e.g. https://git.example.com
          SRC_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          GH_OWNER: ${{ vars.GH_MIRROR_OWNER || github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          if [ -z "$SRC_SERVER" ]; then
            echo "Set the Actions variable FORGE_URL (e.g. https://git.example.com)" >&2
            exit 1
          fi
          SRC_SERVER="${SRC_SERVER%/}"
          echo "Source: ${SRC_SERVER}/${SRC_REPO}"
          echo "Target: github.com/${GH_OWNER}/${REPO_NAME}"

          # Bare clone of everything on Forgejo
          src_url="${SRC_SERVER/:\/\//://oauth2:${SRC_TOKEN}@}/${SRC_REPO}.git"
          git clone --mirror "$src_url" repo.git
          cd repo.git

          dst="https://x-access-token:${GH_TOKEN}@github.com/${GH_OWNER}/${REPO_NAME}.git"

          # main and claude/*, with deletions. --prune only removes GitHub
          # branches that match a destination pattern below (main, claude/*)
          # and have no counterpart on Forgejo; every other branch on GitHub,
          # gh-pages included, is outside the patterns and left alone.
          git push --prune "$dst" \
            '+refs/heads/main:refs/heads/main' \
            '+refs/heads/claude/*:refs/heads/claude/*'

          # Tags: create/update only, never delete (TagBot creates the release
          # tags on GitHub).
          git push "$dst" '+refs/tags/*:refs/tags/*'