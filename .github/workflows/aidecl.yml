name: AI file declarations

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aidecl:
    uses: industrial-mathematics-group/.github/.github/workflows/aidecl.yml@main
    with:
      weight: lines        # weight the badges by lines instead of files
